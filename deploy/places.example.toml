# Example place presets (D-09). Copy to /etc/shinigami/places.toml on the server.
# Other places default to cameras = true.
# Order is preserved. Required ids: home, monash, cbd, gym.
#
# Home detection (review WR-S1): a place counts as home, and never gets cameras or a
# GPS "near ..." label, when ANY of these hold:
#   - id = "home"
#   - the label starts with "Home"
#   - is_home = true
# Any other private place (a family member's house, a flat, a typo'd "hmoe") MUST set
# is_home = true, otherwise it is treated as public and shows nearby cameras.
# is_home = true overrides cameras = true.

[[place]]
id = "home"
label = "Home"
# Home never shows cameras (its location must never reach the phone); this is also the
# built-in default for id home, so the line is a reminder, not a requirement.
cameras = false
# REQUIRED on the server only: set real coordinates in /etc/shinigami/places.toml, never in git
# lat = 0.0
# lon = 0.0

[[place]]
id = "monash"
label = "Monash Clayton"
lat = -37.9105
lon = 145.1340

[[place]]
id = "cbd"
label = "Melbourne CBD"
lat = -37.8136
lon = 144.9631

[[place]]
id = "gym"
label = "Hammers Gym Nunawading"
# approximate public coordinates; adjust on the server
lat = -37.8206
lon = 145.1745
