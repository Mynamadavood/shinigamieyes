[project]
name = "shinigami"
version = "0.1.0"
description = "Shinigami Eyes - private Watch Dogs-style HUD backend"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
  "fastapi==0.162.0",
  "uvicorn[standard]==0.54.0",
  "httpx==0.28.1",
  "pydantic>=2.14,<3",
  "pydantic-settings",
  "sse-starlette==3.6.0",
  "astral==3.2",
  "tzdata",
]

[dependency-groups]
dev = ["pytest", "pytest-asyncio", "respx", "ruff"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["server/shinigami"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["server/tests"]
pythonpath = ["server"]

[tool.ruff]
line-length = 100
